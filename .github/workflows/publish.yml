name: Publish

# Builds and deploys the site to GitHub Pages on every push to main.
# There is nothing time-based on this site, so no schedule is needed;
# the manual button in the Actions tab is there for redeploying without a commit.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build site
        run: python build.py

      - name: Validate links, SEO tags and calculator scripts
        run: python check.py

      # Drives every calculator's real form headlessly and checks the real
      # output text. A wrong formula fails the deploy rather than shipping.
      - name: Test calculator outputs
        run: node tests/run.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # Tell Bing (and therefore Copilot, DuckDuckGo and AI search) about the
      # URLs immediately rather than waiting to be crawled. Never fails the deploy.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Notify IndexNow
        continue-on-error: true
        run: |
          python build.py
          python scripts/indexnow.py
