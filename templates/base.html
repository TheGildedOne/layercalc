<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{page_title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
<meta name="theme-color" content="#e4561a">
<meta name="color-scheme" content="light dark">

<meta property="og:type" content="website">
<meta property="og:title" content="{{og_title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:site_name" content="{{site_name}}">
<meta property="og:locale" content="{{locale}}">
<meta property="og:image" content="{{og_image}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{og_title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{og_image}}">

<link rel="icon" href="/static/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/app.js"></script>

<script type="application/ld+json">
{{jsonld}}
</script>
{{head_extra}}
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="masthead">
  <div class="wrap">
    <a class="brand" href="/" aria-label="{{site_name}} home">
      <img src="/static/mark.svg" alt="" width="30" height="30">
      <span>{{site_name}}</span>
    </a>
    <nav class="nav" aria-label="Primary">{{nav}}</nav>
  </div>
</header>

<main id="main">
{{content}}
</main>

<footer class="footer">
  <div class="wrap">
    <p><strong>{{site_name}}</strong> — {{tagline}}. Every tool runs in your browser; nothing you type is sent anywhere.</p>
    <nav class="footer-nav" aria-label="Footer">{{footer_nav}}</nav>
    <nav class="footer-nav" aria-label="Legal"><a href="/about/">About</a><a href="/contact/">Contact</a><a href="/privacy/">Privacy</a><a href="/terms/">Terms</a></nav>
    <p>&copy; {{year}} {{site_name}}. Results are estimates; always sanity-check before relying on them.</p>
  </div>
</footer>
</body>
</html>
